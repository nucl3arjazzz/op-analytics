name: Збір даних з OpenProject

on:
  schedule:
    # Щопонеділка о 03:17 UTC: це 06:17 за київським літнім часом і 05:17 за зимовим.
    - cron: "17 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Встановити залежності
        run: pip install requests

      - name: Зібрати дані
        env:
          OP_BASE_URL: ${{ secrets.OP_BASE_URL }}
          OP_API_KEY: ${{ secrets.OP_API_KEY }}
          OP_PROJECT_ID: ${{ vars.OP_PROJECT_ID }}
          TIME_LOOKBACK_DAYS: ${{ vars.TIME_LOOKBACK_DAYS || '90' }}
        run: python scripts/collect_openproject.py

      - name: Зберегти дані в репозиторій
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Змін немає"
          else
            git commit -m "data: тижневий знімок OpenProject $(date -u +%F)"
            git push
          fi
